org.gradle.jvmargs=-Xmx4G -XX:MaxMetaspaceSize=4G -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true
# 本项目依赖全部为 AndroidX（已核对无 com.android.support），这行 true 是模板遗留、
# 无实测注释支撑，关掉只是省掉无用的 transform 开销。下面几条带注释的是实测换来的防御项，
# 不要一并改动。
android.enableJetifier=false

# 全局 ~/.gradle/gradle.properties 把 Kotlin 编译设成 in-process，所有 Kotlin 编译挤进
# Gradle daemon 同一个 Metaspace；本项目 9 个子包 + 大量插件会把它撑爆
# （实测 e: java.lang.OutOfMemoryError: Metaspace）。改成独立 daemon 各留一份。
kotlin.compiler.execution.strategy=daemon
kotlin.daemon.jvmargs=-Xmx2G -XX:MaxMetaspaceSize=2G

# 机器上残留着 Metaspace 已耗尽的 Gradle daemon（flutter 侧 --stop 停不掉，别的项目的
# 构建还在用），新构建一旦复用它就在开局直接 OOM。这里强制单次前台 JVM，绕开复用。
org.gradle.daemon=false

# release 变体还要在同一进程里跑 R8，全局的 parallel=true 会让多个插件模块的 Kotlin 编译
# 同时抢 Metaspace（实测 debug 能过、assembleProdRelease 在 compileReleaseKotlin 集体 OOM）。
# 压成低并行换取峰值可控，代价是构建慢一些。
org.gradle.parallel=false
org.gradle.workers.max=2
